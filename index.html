<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6A53">
<title>수업 노트</title>
<link rel="manifest" href="manifest-student.json">
<link rel="icon" href="icon-student-192.png">
<link rel="apple-touch-icon" href="icon-student-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Student app: one scrolling page, big type and big buttons, nothing that leads elsewhere except the class room button. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEA; --ink:#16201B; --muted:#5B6A63; --line:#D6DFDA;
  --accent:#1E6A53; --accent-ink:#FFFFFF; --accent-soft:#DCEEE6; --mark:#F6DA4A; --mark-ink:#3A3000;
  --danger:#B93A27; --danger-soft:#F8E1DC; --ok:#2F7D4F; --ok-soft:#DFF1E5;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 6px 20px rgba(22,32,27,.06);
  --f-display:"Hahmlet","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --surface-2:#1F2925; --ink:#E5ECE8; --muted:#93A39B; --line:#2B3732;
  --accent:#5CC29F; --accent-ink:#0A1A14; --accent-soft:#1B3A2F; --mark:#E6C83A; --mark-ink:#1F1A00;
  --danger:#F07A64; --danger-soft:#3A1F1A; --ok:#6CCB92; --ok-soft:#1C3527;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --surface-2:#1F2925; --ink:#E5ECE8; --muted:#93A39B; --line:#2B3732;
  --accent:#5CC29F; --accent-ink:#0A1A14; --accent-soft:#1B3A2F; --mark:#E6C83A; --mark-ink:#1F1A00;
  --danger:#F07A64; --danger-soft:#3A1F1A; --ok:#6CCB92; --ok-soft:#1C3527;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.page{max-width:560px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:22px}
.hello h1{font-family:var(--f-display);font-size:30px;line-height:1.25}
.hello .date{color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:19px;display:flex;align-items:center;gap:8px}
.sec>h2 .count{font-family:var(--f-num);font-size:14px;color:var(--muted);font-weight:500}
.lab{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:56px;font-size:18px;width:100%}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 140px}

.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.mark{background:var(--mark);color:var(--mark-ink)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}

.next .when{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.3}
.next .plan{font-size:16px}
.wait{background:var(--surface-2);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:15px;text-align:center}
.exams{display:flex;flex-wrap:wrap;gap:8px}
.exam{display:flex;align-items:center;gap:10px;background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:10px 14px;font-weight:600}
.exam .num{font-size:18px}

.hw-title{font-size:19px;font-weight:600;line-height:1.4}
.hw-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--muted)}
.hw-desc{white-space:pre-wrap;font-size:16px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;font-size:15px}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sent{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px}
.fb{border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.rowlist>*+*{border-top:1px solid var(--line);padding-top:12px}
.wset{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wset h3{font-size:18px}
.wset .sub{font-size:14px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:8px 0}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .card{width:min(420px,100%);gap:16px;padding:28px 22px}
.login h1{font-family:var(--f-display);font-size:32px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:15px}
.field input{border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:14px;font-size:18px;width:100%}
.field input:focus{outline:none;border-color:var(--accent)}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0}
.banner{background:var(--danger-soft);color:var(--danger);padding:12px 14px;border-radius:12px;font-size:15px}
.foot{display:flex;justify-content:center;gap:8px;color:var(--muted);font-size:14px}

/* modal (file viewer) */
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.55);display:grid;place-items:center;padding:12px;z-index:20}
.sheet{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h2{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet img{max-width:100%;border-radius:10px;border:1px solid var(--line)}

/* word practice */
.test{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.test-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.test-top .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.test-body{flex:1;overflow:auto;padding:20px 16px}
.test-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcount{font-family:var(--f-num);color:var(--muted)}
.prompt{font-family:var(--f-display);font-size:clamp(28px,8vw,42px);line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.qinput{font-size:22px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);width:100%}
.qinput:focus{outline:none;border-color:var(--accent)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{width:20px;height:20px;accent-color:var(--accent)}
.score{font-family:var(--f-display);font-size:60px;line-height:1}
.score small{font-family:var(--f-body);font-size:18px;color:var(--muted);margin-left:8px}
.wrong{display:flex;flex-direction:column;gap:2px}
.wrong .a{font-size:15px;color:var(--danger)}

/* appeal + live test */
.appeal{align-self:flex-start;margin-top:6px}
.wrong .st{font-size:14px;font-weight:600;margin-top:4px}
.live{z-index:35}
.live .test-top{background:var(--accent);color:var(--accent-ink);border-bottom-color:var(--accent)}
.live .test-top .btn{background:transparent;color:var(--accent-ink);border-color:rgba(255,255,255,.5)}
.timer{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--mark);width:100%}
.timer.low i{background:var(--danger)}
.tleft{font-family:var(--f-num);font-size:15px;color:var(--muted);text-align:right}
.done-list>div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div id="app"><div class="login"><div class="card"><h1>수업 노트</h1><p class="lab">불러오는 중…</p></div></div></div>
<div class="overlay" id="modal" hidden></div>
<div class="test" id="test" hidden></div>
<div class="test live" id="live" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="pick" accept="image/*" multiple hidden>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import {initializeFirestore,collection,doc,onSnapshot,getDoc,setDoc,updateDoc,deleteDoc,query,where,getDocs} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

const firebaseConfig={
  apiKey:"AIzaSyCdVCF4dgTwlxr5yW-5XlnolCQDPztkxVA",
  authDomain:"suup-note.firebaseapp.com",
  projectId:"suup-note",
  storageBucket:"suup-note.firebasestorage.app",
  messagingSenderId:"208510729906",
  appId:"1:208510729906:web:deecd4b383c762901f13ab"
};
const STUDENT_DOMAIN='student.suup-note.firebaseapp.com';
/* Named app so the student sign-in never replaces the teacher's sign-in in the same browser. */
const fbApp=initializeApp(firebaseConfig,'student');
const auth=getAuth(fbApp);
const fs=initializeFirestore(fbApp,{ignoreUndefinedProperties:true});

const S={user:null,sid:null,portal:null,events:[],homework:[],words:[],tests:[],live:[],loaded:new Set(),phase:'boot'};
const LISTS=['events','homework','words','tests'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const DOW='일월화수목금토';
const fmtD=s=>{if(!s)return'';const d=new Date(s+'T00:00');return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`};
const dayDiff=s=>Math.round((new Date(s+'T00:00')-new Date(todayStr()+'T00:00'))/864e5);
const dDay=s=>{const d=dayDiff(s);return d===0?'D-day':d>0?'D-'+d:'D+'+(-d)};
const safeUrl=u=>/^https?:\/\//i.test((u||'').trim())?u.trim():'';
const evSort=(a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||''));
const RES={full:['다 해왔어요','ok'],partial:['일부만 했어요','mark'],missed:['안 해왔어요','bad']};
function callName(name){
  name=String(name||'').trim();if(!name)return '';
  const given=/^[가-힣]{3}$/.test(name)?name.slice(1):name;
  const c=given.charCodeAt(given.length-1);
  if(c<0xAC00||c>0xD7A3)return given;
  return given+((c-0xAC00)%28?'아':'야');
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2800)}
function errMsg(e){const c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-email')return '아이디나 비밀번호가 틀렸어요. 다시 확인해 주세요.';
  if(c==='auth/too-many-requests')return '여러 번 틀려서 잠깐 막혔어요. 조금 있다가 다시 해 주세요.';
  if(c==='auth/network-request-failed'||c==='unavailable')return '인터넷 연결을 확인해 주세요.';
  if(c==='permission-denied')return '볼 수 없는 내용이에요. 선생님께 말씀드려 주세요.';
  if(c==='resource-exhausted')return '오늘은 더 저장할 수 없어요. 선생님께 말씀드려 주세요.';
  if(c==='too_large')return '사진이 너무 커요. 다시 찍어서 내 주세요.';
  if(c==='not-found')return '파일을 찾지 못했어요.';
  return '잘 안 됐어요. 잠시 후 다시 해 주세요.'}

/* ---------- files (kept in pieces, see teacher app) ---------- */
const CHUNK=700000;
const toB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)});
const partsQuery=id=>query(collection(fs,'fileParts'),where('studentId','==',S.sid),where('fileId','==',id));
async function fileGet(id){
  const parts=(await getDocs(partsQuery(id))).docs.map(d=>d.data()).sort((a,b)=>a.n-b.n);
  if(!parts.length)throw{code:'not-found'};
  const bin=atob(parts.map(p=>p.data).join(''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:parts[0].type||'application/octet-stream'});
}
async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    for(const [MAX,q] of [[1600,.8],[1280,.7],[1024,.6]]){
      const k=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));
      if(blob&&blob.size<560000)return blob;
    }
  }catch(e){}
  finally{URL.revokeObjectURL(url)}
  if(file.size<560000)return file;
  throw{code:'too_large'};
}
async function upPhoto(blob,name){
  const b64=await toB64(blob);const id=doc(collection(fs,'fileParts')).id;
  await setDoc(doc(fs,'fileParts',id+'_0'),{fileId:id,studentId:S.sid,by:'student',n:0,total:1,type:blob.type||'image/jpeg',name,data:b64,createdAt:Date.now()});
  return {id,name,type:blob.type||'image/jpeg',size:blob.size,at:Date.now()};
}

/* ---------- sign-in & live data ---------- */
let unsubs=[];
function stopAll(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
onAuthStateChanged(auth,async user=>{
  stopAll();Object.assign(S,{user,sid:null,portal:null,events:[],homework:[],words:[],tests:[],live:[],loaded:new Set()});
  closeModal();T=null;renderTest();L=null;renderLive();
  if(!user){S.phase='login';render();return}
  S.phase='loading';render();
  try{
    const a=await getDoc(doc(fs,'accounts',user.uid));
    if(!a.exists()){S.phase='nolink';render();return}
    S.sid=a.data().sid;
  }catch(e){S.phase='error';S.err=errMsg(e);render();return}
  S.phase='home';
  const fail=e=>{S.phase='error';S.err=errMsg(e);render()};
  unsubs.push(onSnapshot(doc(fs,'portal',S.sid),d=>{S.portal=d.exists()?d.data():{};S.loaded.add('portal');render()},fail));
  LISTS.forEach(c=>unsubs.push(onSnapshot(query(collection(fs,c),where('studentId','==',S.sid)),snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded.add(c);render();if(c==='tests'&&T&&T.phase==='result')renderTest()},fail)));
  /* Live tests started by the teacher. Errors are ignored so the rest of the app keeps working. */
  unsubs.push(onSnapshot(query(collection(fs,'liveTests'),where('studentId','==',S.sid)),snap=>{S.live=snap.docs.map(d=>({id:d.id,...d.data()}));liveSync()},()=>{}));
});
setInterval(()=>{if(S.phase==='home'&&$('#modal').hidden&&!T&&!L)render()},30000);

/* ---------- screens ---------- */
function render(){
  const app=$('#app');
  if(S.phase==='login'||S.phase==='boot'){if(!$('#login-form'))app.innerHTML=loginHtml();return}
  if(S.phase==='loading')app.innerHTML=`<div class="login"><div class="card"><h1>수업 노트</h1><p class="lab">불러오는 중…</p></div></div>`;
  else if(S.phase==='nolink')app.innerHTML=`<div class="login"><div class="card"><h1>수업 노트</h1><div class="banner">아직 선생님이 이 아이디를 연결하지 않았어요. 선생님께 말씀드려 주세요.</div><button class="btn" data-act="logout">로그아웃</button></div></div>`;
  else if(S.phase==='error')app.innerHTML=`<div class="login"><div class="card"><h1>수업 노트</h1><div class="banner">${esc(S.err)}</div><button class="btn primary" data-act="reload">다시 불러오기</button><button class="btn ghost" data-act="logout">로그아웃</button></div></div>`;
  else{const y=window.scrollY;app.innerHTML=homeHtml();window.scrollTo(0,y)}
}
function loginHtml(){
  return `<div class="login"><form class="card" id="login-form" novalidate>
    <div><h1>수업 노트</h1><p style="color:var(--muted)">선생님이 알려 준 아이디와 비밀번호로 들어와요.</p></div>
    <div class="banner" id="login-err" hidden></div>
    <div class="field"><label for="l-id">아이디</label><input id="l-id" name="loginid" autocomplete="username" autocapitalize="off" spellcheck="false" inputmode="text"></div>
    <div class="field"><label for="l-pw">비밀번호</label><div class="pwrow"><input id="l-pw" name="loginpw" type="password" autocomplete="current-password"><button type="button" class="btn small" data-act="pw-toggle" style="min-height:auto">보기</button></div></div>
    <button class="btn primary big" type="submit">들어가기</button>
  </form></div>`;
}
const loaded=()=>['portal',...LISTS].every(c=>S.loaded.has(c));

function nextLesson(){
  const now=new Date(),t=todayStr();
  return S.events.filter(e=>e.type==='lesson').sort(evSort).find(e=>{
    if(e.date>t)return true;if(e.date<t)return false;
    if(!e.time)return true;
    return now<new Date(e.date+'T'+e.time).getTime()+3*36e5;
  });
}
function roomOpen(e){
  if(!e||e.date!==todayStr())return false;
  if(!e.time)return true;
  const start=new Date(e.date+'T'+e.time).getTime(),now=Date.now();
  return now>=start-10*6e4&&now<=start+3*36e5;
}
function whenText(e){
  const d=dayDiff(e.date);
  const day=d===0?'오늘':d===1?'내일':fmtD(e.date);

}

function dueChip(h){

}

/* ---------- word practice ---------- */
let T=null;
const norm=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[\s.~!?·'"]/g,'');
function isRight(item,ans,dir){
  const target=dir==='m2w'?item.w:item.m;const a=norm(ans);if(!a)return false;
  return norm(target)===a||target.split(/[,;/]/).map(norm).filter(Boolean).includes(a);
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderTest(){
  const el=$('#test');if(!T){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;let inner='';
  if(T.phase==='setup'){
    inner=`<div class="card"><div class="lab">단어 ${T.set.items.length}개</div><h2 class="prompt" style="font-size:30px">${esc(T.set.title)}</h2>
      <label class="opt"><input type="radio" name="dir" value="m2w" ${T.dir==='m2w'?'checked':''}> 뜻을 보고 영어 단어 쓰기</label>
      <label class="opt"><input type="radio" name="dir" value="w2m" ${T.dir==='w2m'?'checked':''}> 영어 단어를 보고 뜻 쓰기</label>
      <button class="btn primary big" data-act="t-begin">시작하기</button></div>`;
  }else if(T.phase==='run'){
    const it=T.items[T.i],n=T.items.length;
    inner=`<div class="progress" aria-hidden="true"><i style="width:${T.i/n*100}%"></i></div>
      <div class="card"><div class="qcount">${T.i+1} / ${n}</div><div class="prompt">${esc(T.dir==='m2w'?it.m:it.w)}</div>
      <input class="qinput" id="t-ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="${T.dir==='m2w'?'영어 단어':'뜻'}를 쓰세요" aria-label="답">
      <div class="btns"><button class="btn ghost" data-act="t-skip">모르겠어요</button><button class="btn primary" data-act="t-next">${T.i+1<n?'다음':'채점하기'}</button></div></div>`;
  }else{
    const score=T.res.filter(r=>r.ok).length,n=T.res.length,wrong=T.res.filter(r=>!r.ok);
    inner=`<div class="card"><div class="lab">${esc(T.set.title)}</div><div class="score num">${score}<small>/ ${n}개 맞았어요</small></div>
      ${wrong.length?`<div class="lab">틀린 단어</div><div class="rowlist">${wrong.map((r,i)=>`<div class="wrong"><div><b>${esc(r.w)}</b> · ${esc(r.m)}</div><div class="a">내 답: ${esc(r.ans||'(빈칸)')}</div>${appealHtml(r,i)}</div>`).join('')}</div>${wrong.some(r=>norm(r.ans))?`<p style="font-size:14px;color:var(--muted)">내 답도 맞는 것 같으면 '제 답도 맞아요'를 눌러요. 선생님이 확인해 줄 거예요.</p>`:''}`:'<p style="font-size:20px">모두 맞혔어요! 🎉</p>'}
      <p class="lab" style="font-weight:500">${T.saved?'결과가 선생님께 전달됐어요.':'결과를 저장하는 중…'}</p>
      <div class="btns">${wrong.length?'<button class="btn primary" data-act="t-wrong">틀린 것만 다시</button>':''}<button class="btn" data-act="t-again">처음부터 다시</button></div></div>`;
  }
  el.innerHTML=`<div class="test-top"><span class="t">단어 연습 · ${esc(T.set.title)}</span><button class="btn small" data-act="t-close">${T.phase==='run'?'그만하기':'닫기'}</button></div><div class="test-body"><div class="test-inner">${inner}</div></div>`;
  const a=$('#t-ans');if(a)setTimeout(()=>a.focus(),30);
}
/* "My answer is right too" — asks the teacher to check one wrong answer. */
const myTest=()=>T&&T.testId?S.tests.find(x=>x.id===T.testId):null;
function appealOf(r){const t=myTest();return t?(t.appeals||[]).find(a=>a.w===r.w&&a.m===r.m&&a.ans===r.ans):null}
function appealHtml(r,i){
  if(!norm(r.ans))return '';
  const a=appealOf(r);
  if(a)return a.status==='ok'?'<div class="st" style="color:var(--ok)">✓ 선생님이 맞다고 했어요</div>':a.status==='no'?'<div class="st" style="color:var(--muted)">선생님이 이번엔 틀린 답이래요</div>':'<div class="st" style="color:var(--muted)">선생님께 물어봤어요. 기다려 주세요</div>';
  return `<button class="btn small appeal" data-act="t-appeal" data-i="${i}" ${T.saved&&T.testId?'':'disabled'}>🙋 제 답도 맞아요</button>`;
}
async function sendAppeal(i){
  const r=T.res.filter(x=>!x.ok)[i];const t=myTest();if(!r||!t||appealOf(r))return;
  await updateDoc(doc(fs,'tests',t.id),{appeals:[...(t.appeals||[]),{w:r.w,m:r.m,ans:r.ans,status:'wait',at:Date.now()}]});
  toast('선생님께 물어봤어요');
}
function begin(items,retry){T.items=shuffle(items);T.retry=!!retry;T.i=0;T.answers=[];T.phase='run';renderTest()}
async function answer(ans){
  T.answers.push(ans);
  if(T.i+1<T.items.length){T.i++;renderTest();return}
  T.res=T.items.map((x,i)=>({w:x.w,m:x.m,ans:T.answers[i],ok:isRight(x,T.answers[i],T.dir)}));
  T.phase='result';T.saved=false;renderTest();
  const cur=T;
  try{
    const ref=doc(collection(fs,'tests'));cur.testId=ref.id;
    await setDoc(ref,{studentId:S.sid,setId:cur.set.id,setTitle:cur.set.title+(cur.retry?' (틀린 것 다시)':''),date:todayStr(),dir:cur.dir,total:cur.res.length,score:cur.res.filter(r=>r.ok).length,wrong:cur.res.filter(r=>!r.ok).map(({w,m,ans})=>({w,m,ans})),by:'student',createdAt:Date.now()});
    cur.saved=true;if(T===cur)renderTest();
  }catch(e){toast(errMsg(e))}
}

/* ---------- live test (teacher starts it during class) ---------- */
let L=null;            // {id, local:{idx:answer}, qAt, dismissed}
const DISMISS='live-dismissed';
function dismissed(){try{return JSON.parse(localStorage.getItem(DISMISS)||'[]')}catch(e){return[]}}
function setDismissed(id){try{const a=dismissed().concat(id).slice(-30);localStorage.setItem(DISMISS,JSON.stringify(a))}catch(e){}}
const liveDoc=()=>L?S.live.find(x=>x.id===L.id):null;
function liveSync(){
  if(L){const d=liveDoc();if(!d||d.status==='cancel'){L=null;renderLive();toast('선생님이 시험을 멈췄어요');render();return}renderLive();return}
  const run=S.live.filter(x=>x.status==='run'&&!dismissed().includes(x.id)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  if(run){
    T=null;renderTest();closeModal();
    L={id:run.id,local:{},qAt:0,qi:-1};
    if(!run.seen)updateDoc(doc(fs,'liveTests',run.id),{seen:Date.now()}).catch(()=>{});
    renderLive();
  }
}
const answered=(d,i)=>(d.answers&&d.answers[i]!=null)||L.local[i]!=null;
function liveIdx(d){for(let i=0;i<(d.prompts||[]).length;i++)if(!answered(d,i))return i;return -1}
let liveTimer=null,liveKey='';
function renderLive(){
  const el=$('#live');const d=liveDoc();
  if(!L||!d){el.hidden=true;el.innerHTML='';liveKey='';clearInterval(liveTimer);return}
  el.hidden=false;
  const n=(d.prompts||[]).length;const i=d.status==='run'?liveIdx(d):-2;
  const key=d.status+'|'+i+'|'+(d.status==='done'?d.score:'');
  if(key===liveKey)return;               // nothing new to show — keep what the student is typing
  liveKey=key;clearInterval(liveTimer);
  let inner='';
  if(d.status==='done'){
    const res=d.result||[];
    inner=`<div class="card"><div class="lab">${esc(d.setTitle||'')}</div><div class="score num">${d.score??0}<small>/ ${d.total??n}개 맞았어요</small></div>
      <div class="rowlist done-list">${(d.prompts||[]).map((p,k)=>`<div><span>${esc(p)}</span><span class="chip ${res[k]?'ok':'bad'}">${res[k]?'맞음':'틀림'}</span></div>`).join('')}</div>
      <button class="btn primary big" data-act="l-close">닫기</button></div>`;
  }else if(i===-1){
    inner=`<div class="card" style="text-align:center"><p style="font-size:44px">✍️</p><h2>다 풀었어요!</h2><p style="color:var(--muted)">선생님이 채점하고 있어요. 잠깐 기다려 주세요.</p></div>`;
  }else{
    L.qi=i;L.qAt=Date.now();
    inner=`<div class="progress" aria-hidden="true"><i style="width:${i/n*100}%"></i></div>
      <div class="card"><div class="qcount">${i+1} / ${n}</div>
      ${d.limit?`<div class="timer" id="l-timer"><i></i></div><div class="tleft num" id="l-left">${d.limit}초</div>`:''}
      <div class="prompt">${esc(d.prompts[i])}</div>
      <input class="qinput" id="l-ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="${d.dir==='m2w'?'영어 단어':'뜻'}를 쓰세요" aria-label="답">
      <button class="btn primary big" data-act="l-next">${i+1<n?'다음':'다 했어요'}</button></div>`;
    if(d.limit)liveTimer=setInterval(()=>{
      const left=d.limit*1000-(Date.now()-L.qAt);const bar=$('#l-timer i'),txt=$('#l-left');
      if(bar)bar.style.width=Math.max(0,left/(d.limit*10))+'%';
      if(txt)txt.textContent=Math.max(0,Math.ceil(left/1000))+'초';
      if(left<=3000)$('#l-timer')?.classList.add('low');
      if(left<=0){clearInterval(liveTimer);liveSubmit()}
    },200);
  }
  el.innerHTML=`<div class="test-top"><span class="t">선생님 시험 · ${esc(d.setTitle||'')}</span>${d.status==='done'?'<button class="btn small" data-act="l-close">닫기</button>':''}</div><div class="test-body"><div class="test-inner">${inner}</div></div>`;
  const a=$('#l-ans');if(a)setTimeout(()=>a.focus(),30);
}
function liveSubmit(){
  const d=liveDoc();if(!d||d.status!=='run')return;
  const i=L.qi;if(i<0||answered(d,i))return;
  const a=($('#l-ans')||{}).value||'';
  L.local[i]=a;
  updateDoc(doc(fs,'liveTests',d.id),{['answers.'+i]:{a,at:Date.now()}}).catch(e=>{delete L.local[i];liveKey='';renderLive();toast(errMsg(e))});
  renderLive();
}
function liveClose(){if(L)setDismissed(L.id);L=null;renderLive();render()}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(e.target.id==='modal')closeModal();return}
  const act=b.dataset.act,id=b.dataset.id;
  try{switch(act){
    case 'logout':await signOut(auth);break;
    case 'reload':location.reload();break;
    case 'pw-toggle':{const i=$('#l-pw');const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'숨기기':'보기';break}
    case 'close':closeModal();break;
    case 'file-open':openFile(id,b.dataset.name,b.dataset.mine);break;

    case 'photo-del':{if(b.dataset.armed){b.disabled=true;await deletePhoto(id,b.dataset.hw)}else{b.dataset.armed='1';b.textContent='한 번 더 누르면 지워져요'}break}
    case 'test-start':{const set=S.words.find(w=>w.id===id);if(set){T={set,phase:'setup',dir:'m2w'};renderTest()}break}
    case 't-begin':T.dir=(document.querySelector('input[name=dir]:checked')||{}).value||'m2w';begin(T.set.items);break;
    case 't-next':answer($('#t-ans').value);break;
    case 't-skip':answer('');break;
    case 't-wrong':begin(T.res.filter(r=>!r.ok).map(({w,m})=>({w,m})),true);break;
    case 't-again':begin(T.set.items);break;
    case 't-close':T=null;renderTest();render();break;
    case 't-appeal':b.disabled=true;await sendAppeal(+b.dataset.i);renderTest();break;
    case 'l-next':liveSubmit();break;
    case 'l-close':liveClose();break;
  }}catch(err){toast(errMsg(err))}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='t-ans'&&!e.isComposing){e.preventDefault();answer(e.target.value)}
  if(e.key==='Enter'&&e.target.id==='l-ans'&&!e.isComposing){e.preventDefault();liveSubmit()}
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
});
</script>
</body>
</html>
